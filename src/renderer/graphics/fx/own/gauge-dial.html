<!--
  CreatorClips unit "gauge-dial": a half-circle dial whose needle sweeps to a said percent or score,
  remade from HyperFrames' conic-progress-ring component in its style and motion (https://github.com/heygen-com/hyperframes,
  registry/components/conic-progress-ring, Copyright 2026 HeyGen, Inc., Apache License 2.0; see ../vendor/LICENSE and
  ../vendor/NOTICE). The ring becomes a dial (a track, the filled arc, ticks and a needle) and takes its number and
  words as variables, sized to its box (cq units), themed by the brand tokens, timed by CreatorClips' shared motion
  (window.__ccMotion). Seek-driven: every frame is set from the paused timeline, nothing runs on the wall clock.

  Variables: value (the number as said), max (the top of the scale: 100 for a percent, 10 for "9 out of 10"),
  unit (after the number, "%" or "/10"), label (the words under it, as said).
-->
<template>
  <div id="root" data-composition-id="gauge-dial" data-duration="3.5">
    <style>
      #root { position: absolute; inset: 0; container-type: size; display: grid; place-items: center; font-family: var(--font-body, sans-serif); color: var(--fg, #f8fafc); }
      .gd-card { box-sizing: border-box; width: min(96cqw, 150cqh); height: 96cqh; padding: 5cqmin 6cqmin 4.5cqmin; border-radius: var(--radius, 28px);
        background: var(--surface, rgba(15, 18, 26, 0.9)); border: 0.25cqmin solid var(--border, rgba(255, 255, 255, 0.16));
        box-shadow: 0 2.4cqmin 6cqmin rgba(0, 0, 0, 0.28); display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 1.5cqmin; }
      .gd-dial { position: relative; width: 100%; height: 100%; min-height: 0; }
      .gd-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .gd-track { fill: none; stroke: color-mix(in srgb, var(--fg, #f8fafc) 14%, transparent); stroke-linecap: round; }
      .gd-fill { fill: none; stroke: var(--brand, #22c55e); stroke-linecap: round; }
      .gd-tick { stroke: color-mix(in srgb, var(--fg, #f8fafc) 42%, transparent); stroke-linecap: round; }
      .gd-tick.gd-major { stroke: color-mix(in srgb, var(--fg, #f8fafc) 70%, transparent); }
      .gd-needle { fill: var(--fg, #f8fafc); }
      .gd-hub { fill: var(--fg, #f8fafc); }
      .gd-hub-dot { fill: var(--brand, #22c55e); }
      .gd-read { display: flex; flex-direction: column; align-items: center; gap: 1cqmin; }
      .gd-value { font: 900 19cqmin/0.9 var(--font-display, sans-serif); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .gd-unit { font-size: 0.5em; letter-spacing: -0.01em; margin-left: 0.06em; color: var(--brand, #22c55e); }
      .gd-label { font: 800 5.4cqmin/1.1 var(--font-body, sans-serif); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted, rgba(226, 232, 240, 0.74)); text-align: center; max-width: 88cqw; }
      .gd-label:empty { display: none; }
    </style>
    <div class="gd-card"><div class="gd-dial"></div><div class="gd-read"><div class="gd-value"><span class="gd-num"></span><span class="gd-unit"></span></div><div class="gd-label"></div></div></div>
    <script>
      (function () {
        var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        var M = window.__ccMotion || { move_s: 0.333, enter: 'expo.out', exit: 'power2.in', from_scale: 1.08, stagger_s: 0.2 };
        var root = document.getElementById('root');
        var words = function (v) { return String(v == null ? '' : v).replace(/​/g, '').trim(); };
        var num = function (v) { var m = /-?\d[\d,]*(?:\.\d+)?/.exec(String(v == null ? '' : v)); return m ? parseFloat(m[0].replace(/,/g, '')) : NaN; };
        var max = num(vars.max); if (!(max > 0)) max = 100;
        var value = num(vars.value); if (!isFinite(value)) value = 0;
        var share = Math.max(0, Math.min(1, value / max));
        var decimals = /\.\d/.test(String(vars.value)) ? 1 : 0;
        var unit = words(vars.unit);
        root.querySelector('.gd-unit').textContent = unit;
        root.querySelector('.gd-label').textContent = words(vars.label);
        var numEl = root.querySelector('.gd-num');
        // The dial: a half circle in a 200 x 112 box (center 100,100, radius 84), ticks inside the track.
        var NS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 -6 200 118'); svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
        var R = 84, CX = 100, CY = 100, W = 15;
        var arc = function (cls) {
          var p = document.createElementNS(NS, 'path'); p.setAttribute('class', cls);
          p.setAttribute('d', 'M ' + (CX - R) + ' ' + CY + ' A ' + R + ' ' + R + ' 0 0 1 ' + (CX + R) + ' ' + CY);
          p.setAttribute('stroke-width', String(W)); svg.appendChild(p); return p;
        };
        arc('gd-track');
        var fill = arc('gd-fill');
        var len = Math.PI * R;
        fill.setAttribute('stroke-dasharray', len.toFixed(2) + ' ' + (len + 40).toFixed(2));
        for (var i = 0; i <= 20; i++) {
          var a = Math.PI * (1 - i / 20), major = i % 5 === 0;
          var r1 = R - W / 2 - 5, r2 = r1 - (major ? 9 : 5);
          var t = document.createElementNS(NS, 'line'); t.setAttribute('class', 'gd-tick' + (major ? ' gd-major' : ''));
          t.setAttribute('x1', (CX + r1 * Math.cos(a)).toFixed(2)); t.setAttribute('y1', (CY - r1 * Math.sin(a)).toFixed(2));
          t.setAttribute('x2', (CX + r2 * Math.cos(a)).toFixed(2)); t.setAttribute('y2', (CY - r2 * Math.sin(a)).toFixed(2));
          t.setAttribute('stroke-width', major ? '2.6' : '1.6'); svg.appendChild(t);
        }
        // The needle: a tapered blade from the hub, pointing left at 0 and swinging clockwise.
        var needle = document.createElementNS(NS, 'g');
        var blade = document.createElementNS(NS, 'path'); blade.setAttribute('class', 'gd-needle');
        blade.setAttribute('d', 'M ' + CX + ' ' + (CY - 4.2) + ' L ' + (CX - R + 20) + ' ' + (CY - 0.9) + ' Q ' + (CX - R + 17) + ' ' + CY + ' ' + (CX - R + 20) + ' ' + (CY + 0.9) + ' L ' + CX + ' ' + (CY + 4.2) + ' Z');
        needle.appendChild(blade); svg.appendChild(needle);
        var hub = document.createElementNS(NS, 'circle'); hub.setAttribute('class', 'gd-hub'); hub.setAttribute('cx', CX); hub.setAttribute('cy', CY); hub.setAttribute('r', '9'); svg.appendChild(hub);
        var dot = document.createElementNS(NS, 'circle'); dot.setAttribute('class', 'gd-hub-dot'); dot.setAttribute('cx', CX); dot.setAttribute('cy', CY); dot.setAttribute('r', '4'); svg.appendChild(dot);
        root.querySelector('.gd-dial').appendChild(svg);
        var state = { p: 0 };
        var paint = function () {
          var p = state.p;
          fill.setAttribute('stroke-dashoffset', (len * (1 - p)).toFixed(2));
          fill.style.opacity = p > 0.002 ? '1' : '0';
          needle.setAttribute('transform', 'rotate(' + (180 * p).toFixed(3) + ' ' + CX + ' ' + CY + ')');
          var shown = share > 0 ? value * (p / share) : 0;
          numEl.textContent = (decimals ? shown.toFixed(1) : String(Math.round(shown))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        };
        paint();
        var tl = gsap.timeline({ paused: true });
        tl.fromTo('.gd-card', { opacity: 0, scale: M.from_scale }, { opacity: 1, scale: 1, duration: M.move_s * 1.4, ease: M.enter }, 0);
        tl.fromTo('.gd-tick', { opacity: 0 }, { opacity: 1, duration: 0.24, stagger: 0.012, ease: 'power1.out' }, 0.12);
        tl.fromTo('.gd-label', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: M.move_s, ease: M.enter }, 0.2);
        // The sweep: fast start, long settle (no bounce); it lands on the number as said (sync 1.3 s).
        tl.fromTo(state, { p: 0 }, { p: share, duration: 1.0, ease: 'expo.out', onUpdate: paint }, 0.3);
        tl.fromTo('.gd-value', { scale: 1 }, { scale: 1.06, duration: 0.12, ease: 'power2.out' }, 1.3);
        tl.to('.gd-value', { scale: 1, duration: 0.3, ease: M.enter }, 1.42);
        window.__timelines = window.__timelines || {};
        window.__timelines['gauge-dial'] = tl;
      })();
    </script>
  </div>
</template>
