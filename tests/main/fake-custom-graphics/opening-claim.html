<div id="cg-root" data-duration="6.55">
  <div class="panel">
    <div class="chip c1"><svg class="ico eye" viewBox="0 0 64 40"><path d="M4 20 C18 2 46 2 60 20 C46 38 18 38 4 20 Z"/><circle cx="32" cy="20" r="8"/></svg><span>an influencer</span><svg class="strike" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M6 26 C120 10 280 30 394 12"/></svg></div>
    <div class="chip c2"><svg class="ico dots" viewBox="0 0 64 40"><circle class="d" cx="10" cy="26" r="7"/><circle class="d" cx="26" cy="16" r="7"/><circle class="d" cx="42" cy="26" r="7"/><circle class="d" cx="56" cy="14" r="6"/></svg><span>a huge audience</span><svg class="strike" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M6 14 C140 30 260 8 394 24"/></svg></div>
    <svg class="arrow" viewBox="0 0 90 120"><path d="M14 10 L70 60 L14 110"/></svg>
    <div class="win">
      <div class="lead">a lot of</div>
      <div class="hero">money</div>
      <svg class="swash" viewBox="0 0 380 34" preserveAspectRatio="none"><path d="M6 22 C110 6 250 30 374 10"/></svg>
      <div class="tail">on the internet</div>
    </div>
  </div>
</div>
<style>
#cg-root .panel{position:absolute;left:48px;right:48px;top:150px;bottom:20px;background:var(--cg-paper);border-radius:40px}
#cg-root .chip{position:absolute;left:36px;height:88px;display:flex;align-items:center;gap:14px;padding:0 24px;border:4px solid rgba(14,21,37,.14);border-radius:24px;font-family:var(--cg-font-body);font-weight:800;font-size:46px;line-height:1;color:var(--cg-paper-ink);white-space:nowrap}
#cg-root .c1{top:70px} #cg-root .c2{top:190px}
#cg-root .ico{width:54px;height:34px;flex:none}
#cg-root .eye path{fill:none;stroke:var(--cg-paper-ink);stroke-width:5;stroke-linejoin:round}
#cg-root .eye circle{fill:var(--cg-paper-ink)}
#cg-root .dots .d{fill:var(--cg-paper-ink)}
#cg-root .strike{position:absolute;left:84px;top:30px;width:calc(100% - 104px);height:40px;overflow:visible}
#cg-root .strike path{fill:none;stroke:var(--cg-bad);stroke-width:9;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420}
#cg-root .arrow{position:absolute;left:546px;top:114px;width:46px;height:120px}
#cg-root .arrow path{fill:none;stroke:rgba(14,21,37,.28);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160}
#cg-root .win{position:absolute;left:612px;right:30px;top:24px;bottom:24px;display:flex;flex-direction:column;justify-content:center}
#cg-root .lead{font-family:var(--cg-font-body);font-weight:800;font-size:44px;line-height:1;color:rgba(14,21,37,.55)}
#cg-root .hero{font-family:var(--cg-font-display);font-size:116px;line-height:1;margin-top:8px;color:var(--cg-accent-ink);transform-origin:0 70%}
#cg-root .swash{width:300px;height:30px;margin-top:4px;overflow:visible}
#cg-root .swash path{fill:none;stroke:var(--cg-accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400}
#cg-root .tail{font-family:var(--cg-font-body);font-weight:800;font-size:44px;line-height:1;margin-top:14px;color:var(--cg-paper-ink)}
</style>
<script>
const D = parseFloat(document.getElementById('cg-root').dataset.duration);
const tl = gsap.timeline({ paused: true });
// Gentle life once something has landed: finite yoyo tweens that end before the exit.
const idle = (sel, vars, at, beat) => { const b = beat || 0.8; let n = Math.max(1, Math.floor((D - 0.5 - at) / b) - 1); if (n % 2 === 0) n -= 1; tl.to(sel, Object.assign({ duration: b, ease: 'sine.inOut', yoyo: true, repeat: Math.max(1, n) }, vars), at); };
tl.from('#cg-root .panel', { scale: 0.94, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.25)
  // "influencer": the chip with its eye lands, then is struck out.
  .from('#cg-root .c1', { y: 26, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 1.2)
  .to('#cg-root .c1 .strike path', { strokeDashoffset: 0, duration: 0.32, ease: 'power3.out' }, 1.75)
  .to('#cg-root .c1 span, #cg-root .c1 .eye', { opacity: 0.4, duration: 0.3, ease: 'power2.out' }, 1.8)
  // "huge audience": the crowd dots pop in, then the chip is struck out too.
  .from('#cg-root .c2', { y: 26, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 2.38)
  .from('#cg-root .c2 .d', { scale: 0, transformOrigin: '50% 50%', duration: 0.3, ease: 'back.out(1.4)', stagger: 0.07 }, 2.76)
  .to('#cg-root .c2 .strike path', { strokeDashoffset: 0, duration: 0.32, ease: 'power3.out' }, 3.15)
  .to('#cg-root .c2 span, #cg-root .c2 .dots', { opacity: 0.4, duration: 0.3, ease: 'power2.out' }, 3.2)
  // "make" → "a lot of" → "money" (the focus) → "on the internet".
  .to('#cg-root .arrow path', { strokeDashoffset: 0, duration: 0.4, ease: 'power3.out' }, 3.6)
  .from('#cg-root .lead', { x: -24, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 4.2)
  .from('#cg-root .hero', { y: 34, scale: 0.9, autoAlpha: 0, duration: 0.6, ease: 'expo.out' }, 4.82)
  .to('#cg-root .swash path', { strokeDashoffset: 0, duration: 0.45, ease: 'power3.out' }, 5.1)
  .from('#cg-root .tail', { y: 20, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 5.5);
idle('#cg-root .c1 .eye circle', { x: 5 }, 1.25, 0.6);
idle('#cg-root .c2 .d', { y: -3, stagger: 0.08 }, 3.1, 0.5);
idle('#cg-root .arrow', { x: 6 }, 4.0, 0.5);
idle('#cg-root .hero', { scale: 1.03 }, 5.45, 0.5);
tl.to('#cg-root .panel', { autoAlpha: 0, y: -16, duration: 0.3, ease: 'power2.in' }, D - 0.36);
window.__timelines = [tl];
</script>
