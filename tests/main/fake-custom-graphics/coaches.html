<div id="cg-root" data-duration="2.50">
  <div class="panel">
    <div class="who">Most coaches</div>
    <div class="lose">lose <span class="k">clients</span></div>
    <svg class="leak" viewBox="0 0 300 60"><path d="M10 30 H250 M222 8 L262 30 L222 52"/></svg>
  </div>
</div>
<style>
#cg-root .panel{position:absolute;left:64px;right:64px;top:40px;bottom:40px;background:var(--cg-paper);border-radius:36px}
#cg-root .who{position:absolute;left:56px;top:48px;font-family:var(--cg-font-body);font-weight:800;font-size:56px;line-height:1;color:rgba(14,21,37,.6)}
#cg-root .lose{position:absolute;left:56px;top:124px;font-family:var(--cg-font-display);font-size:104px;line-height:1;color:var(--cg-paper-ink)}
#cg-root .k{color:var(--cg-accent-ink)}
#cg-root .leak{position:absolute;right:56px;top:150px;width:200px;height:60px}
#cg-root .leak path{fill:none;stroke:var(--cg-bad);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
</style>
<script>
const D = parseFloat(document.getElementById('cg-root').dataset.duration);
const tl = gsap.timeline({ paused: true });
tl.from('#cg-root .panel', { scale: 0.94, autoAlpha: 0, duration: 0.4, ease: 'expo.out' }, 0)
  .from('#cg-root .who', { y: 24, autoAlpha: 0, duration: 0.4, ease: 'expo.out' }, 0.05)
  .from('#cg-root .lose', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.6)
  .from('#cg-root .leak', { x: -30, autoAlpha: 0, duration: 0.4, ease: 'power4.out' }, 0.9)
  .to('#cg-root .panel', { autoAlpha: 0, y: -14, duration: 0.25, ease: 'power2.in' }, D - 0.3);
window.__timelines = [tl];
</script>
