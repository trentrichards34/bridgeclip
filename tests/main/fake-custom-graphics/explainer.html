<div id="cg-root" data-duration="{{DUR}}">
  <div class="line">// {{N}} — {{LABEL}}</div>
  <svg class="art" viewBox="0 0 1080 1085">
    <path class="ground" d="M80 980 H1000"/>
    <g class="hero"><rect x="320" y="400" width="440" height="360" rx="18"/><path d="M370 490 H710 M370 560 H650 M370 630 H690"/></g>
    <g class="stamp"><rect x="620" y="290" width="300" height="96" rx="10"/></g>
    <g class="arrow"><path d="M220 760 C300 700 330 640 350 600"/><path d="M330 620 L352 596 L364 628"/></g>
  </svg>
  <div class="label">{{HERO}}</div>
  <div class="word">{{STAMP}}</div>
</div>
<style>
#cg-root .line{position:absolute;left:56px;top:4px;font-family:var(--cg-font-body);font-size:30px;color:var(--cg-muted);white-space:nowrap}
#cg-root .art{position:absolute;left:0;top:0;width:1080px;height:1085px;overflow:visible}
#cg-root .ground{stroke:var(--cg-ink);stroke-width:6;stroke-linecap:round}
#cg-root .hero rect{fill:var(--cg-paper);stroke:var(--cg-ink);stroke-width:8}
#cg-root .hero path{stroke:var(--cg-muted);stroke-width:8;stroke-linecap:round;fill:none}
#cg-root .stamp rect{fill:none;stroke:var(--cg-accent);stroke-width:8}
#cg-root .arrow path{fill:none;stroke:var(--cg-ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
#cg-root .label{position:absolute;left:340px;top:780px;width:400px;text-align:center;font-family:var(--cg-font-display);font-size:56px;color:var(--cg-ink)}
#cg-root .word{position:absolute;left:620px;top:302px;width:300px;text-align:center;font-family:var(--cg-font-accent);font-style:italic;font-size:62px;color:var(--cg-accent);transform:rotate(-6deg)}
</style>
<script>
const D = parseFloat(document.getElementById('cg-root').dataset.duration);
const CUES = [{{CUES}}];
const tl = gsap.timeline({ paused: true });
tl.from('#cg-root .line', { autoAlpha: 0, duration: 0.3 }, 0)
  .from('#cg-root .ground', { scaleX: 0, transformOrigin: '0% 50%', duration: 0.5, ease: 'power4.out' }, 0.05)
  .from('#cg-root .hero', { y: 40, autoAlpha: 0, duration: 0.5, ease: 'expo.out' }, 0.1)
  .from('#cg-root .label', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.2);
CUES.forEach((c, i) => {
  const at = Math.min(D - 0.6, c);
  if (i % 3 === 0) tl.fromTo('#cg-root .stamp, #cg-root .word', { scale: 1.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: 'back.out(1.4)' }, at);
  else if (i % 3 === 1) tl.fromTo('#cg-root .hero', { rotation: 0 }, { rotation: i % 2 ? 3 : -3, duration: 0.5, ease: 'power2.out' }, at);
  else tl.fromTo('#cg-root .arrow', { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: 'expo.out' }, at);
});
let n = Math.max(1, Math.floor((D - 0.4) / 0.9) - 1); if (n % 2 === 0) n -= 1;
tl.to('#cg-root .ground', { y: 6, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: n }, 0.3);
// Kept alive to the last frame (a section holds its final state for the next one).
tl.to('#cg-root .hero, #cg-root .label', { y: -40, duration: 1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, Math.max(0.6, D - 2.05));
tl.to({}, { duration: 0.01 }, D - 0.01);
window.__timelines = [tl];
</script>
