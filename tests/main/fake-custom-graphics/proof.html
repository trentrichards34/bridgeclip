<div id="cg-root" data-duration="4.50">
  <svg class="art" viewBox="0 0 1080 806">
    <path class="base" d="M120 636 H960"/>
    <rect class="bar spent" x="214" y="402" width="196" height="234" rx="18"/>
    <rect class="bar made" x="604" y="196" width="260" height="440" rx="18"/>
    <path class="tick" d="M410 402 H604" />
  </svg>
  <div class="val v-spent">$4,365</div>
  <div class="val v-made"><span class="count">$8,188</span></div>
  <div class="cap c-spent">on ads</div>
  <div class="cap c-made">generating</div>
  <div class="date">October 20th</div>
</div>
<style>
#cg-root .art{position:absolute;left:0;top:0;width:1080px;height:806px}
#cg-root .base{stroke:rgba(14,21,37,.35);stroke-width:6;stroke-linecap:round}
#cg-root .spent{fill:rgba(14,21,37,.18)}
#cg-root .made{fill:var(--cg-accent)}
#cg-root .tick{stroke:rgba(14,21,37,.3);stroke-width:4;stroke-dasharray:4 14;stroke-linecap:round}
#cg-root .val{position:absolute;font-family:var(--cg-font-display);line-height:1;white-space:nowrap;text-align:center}
#cg-root .v-spent{left:152px;width:320px;top:306px;font-size:74px;color:rgba(14,21,37,.62)}
#cg-root .v-made{left:414px;width:640px;top:44px;font-size:132px;color:var(--cg-accent-ink)}
#cg-root .cap{position:absolute;top:660px;font-family:var(--cg-font-body);font-weight:800;font-size:48px;line-height:1;text-align:center;color:var(--cg-ink)}
#cg-root .c-spent{left:152px;width:320px} #cg-root .c-made{left:574px;width:320px}
#cg-root .date{position:absolute;left:0;right:0;top:738px;text-align:center;font-family:var(--cg-font-body);font-weight:700;font-size:40px;line-height:1;color:var(--cg-muted)}
</style>
<script>
const D = parseFloat(document.getElementById('cg-root').dataset.duration);
const count = document.querySelector('#cg-root .count');
const money = { v: 8188 };
const show = () => { const n = Math.round(money.v); count.textContent = '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
const tl = gsap.timeline({ paused: true });
tl.from('#cg-root .base', { scaleX: 0, transformOrigin: '50% 50%', duration: 0.45, ease: 'power4.out' }, 0)
  .from('#cg-root .spent', { scaleY: 0, transformOrigin: '50% 100%', duration: 0.5, ease: 'expo.out' }, 0.05)
  .from('#cg-root .v-spent, #cg-root .c-spent', { y: 20, autoAlpha: 0, duration: 0.45, ease: 'expo.out', stagger: 0.06 }, 0.12)
  .from('#cg-root .made', { scaleY: 0, transformOrigin: '50% 100%', duration: 1.25, ease: 'expo.out' }, 0.05)
  .from('#cg-root .v-made', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.1)
  .from(money, { v: 0, duration: 1.25, ease: 'power3.out', onUpdate: show }, 0.05)
  .from('#cg-root .c-made', { y: 20, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.2)
  .from('#cg-root .tick', { autoAlpha: 0, duration: 0.3 }, 1.2)
  .from('#cg-root .date', { y: 14, autoAlpha: 0, duration: 0.4, ease: 'expo.out' }, 1.4)
  .to('#cg-root .art, #cg-root .val, #cg-root .cap, #cg-root .date', { autoAlpha: 0, y: -18, duration: 0.3, ease: 'power2.in', stagger: 0.02 }, D - 0.36);
show();
window.__timelines = [tl];
</script>
