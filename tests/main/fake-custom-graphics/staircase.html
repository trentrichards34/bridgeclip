<style>
#cg-root .title{position:absolute;left:0;right:0;top:56px;text-align:center;font-family:var(--cg-font-display);font-size:92px;line-height:1.04;color:var(--cg-ink)}
#cg-root .art{position:absolute;left:0;top:0;width:1080px;height:1267px;overflow:visible}
#cg-root .ground{stroke:var(--cg-muted);stroke-width:6;stroke-linecap:round}
#cg-root .fill{fill:rgba(255,255,255,.08)}
#cg-root .lit{fill:var(--cg-accent);opacity:0}
#cg-root .stairs{fill:none;stroke:var(--cg-ink);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:3600;stroke-dashoffset:3600}
#cg-root .obj path,#cg-root .obj circle{fill:none;stroke:var(--cg-ink);stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
#cg-root .obj .pupil{fill:var(--cg-ink);stroke:none}
#cg-root .tick{fill:none;stroke:var(--cg-ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120}
#cg-root .beam path{fill:none;stroke:var(--cg-accent);stroke-width:8;stroke-linecap:round}
#cg-root .crowd,#cg-root .buyer{fill:var(--cg-ink)}
#cg-root .way{fill:none;stroke:var(--cg-ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:4 16}
#cg-root .three{font-family:var(--cg-font-display);font-size:96px;fill:var(--cg-accent)}
#cg-root .who{fill:var(--cg-ink)}
#cg-root .label{position:absolute;font-family:var(--cg-font-body);font-weight:800;font-size:54px;line-height:1.05;color:var(--cg-ink);white-space:nowrap}
#cg-root .t1{left:86px;top:1000px} #cg-root .t2{left:406px;top:690px} #cg-root .t3{left:726px;top:460px}
</style>
<script>
const D = parseFloat(document.getElementById('cg-root').dataset.duration);
const tl = gsap.timeline({ paused: true });
const ink = '#0E1525', white = '#FFFFFF';
const idle = (sel, vars, at, beat) => { const b = beat || 0.8; let n = Math.max(1, Math.floor((D - 0.5 - at) / b) - 1); if (n % 2 === 0) n -= 1; tl.to(sel, Object.assign({ duration: b, ease: 'sine.inOut', yoyo: true, repeat: Math.max(1, n) }, vars), at); };
tl.from('#cg-root .title', { y: 30, autoAlpha: 0, duration: 0.55, ease: 'expo.out' }, 0.05)
  .from('#cg-root .ground', { scaleX: 0, transformOrigin: '0% 50%', duration: 0.5, ease: 'power4.out' }, 0.05)
  .to('#cg-root .stairs', { strokeDashoffset: 0, duration: 1.1, ease: 'power2.inOut' }, 0.2)
  .from('#cg-root .who', { autoAlpha: 0, duration: 0.4, ease: 'expo.out' }, 0.5)
  // "a product": step 1 lights, its box lands.
  .from('#cg-root .o1', { y: -40, autoAlpha: 0, duration: 0.5, ease: 'expo.out' }, 0.84)
  .to('#cg-root .l1', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.86)
  .from('#cg-root .t1', { y: 24, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 0.88)
  .to('#cg-root .t1', { color: ink, duration: 0.2 }, 0.88)
  .to('#cg-root .title', { opacity: 0.5, duration: 0.4 }, 0.9)
  // "sell": the first buyer hops on; "obvious": a tick.
  .from('#cg-root .buyer', { y: -60, autoAlpha: 0, duration: 0.45, ease: 'back.out(1.4)' }, 1.9)
  .to('#cg-root .tick', { strokeDashoffset: 0, duration: 0.35, ease: 'power3.out' }, 2.68)
  // "an offer": step 2 lights, the figure climbs.
  .to('#cg-root .l1', { opacity: 0.25, duration: 0.3, ease: 'power2.out' }, 4.12)
  .to('#cg-root .t1', { color: white, duration: 0.3 }, 4.12)
  .from('#cg-root .o2', { y: -40, autoAlpha: 0, duration: 0.5, ease: 'expo.out' }, 4.12)
  .to('#cg-root .l2', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 4.14)
  .from('#cg-root .t2', { y: 24, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 4.16)
  .to('#cg-root .t2', { color: ink, duration: 0.2 }, 4.16)
  .to('#cg-root .who', { attr: { x: 404, y: 480 }, duration: 0.55, ease: 'power3.inOut' }, 4.5)
  // "attracts": the offer sends out its beam; "people": the crowd gathers on it.
  .from('#cg-root .b2 path', { scaleY: 0, transformOrigin: '50% 0%', autoAlpha: 0, duration: 0.35, ease: 'power4.out', stagger: 0.06 }, 5.38)
  .from('#cg-root .c2 use', { y: -50, autoAlpha: 0, duration: 0.4, ease: 'expo.out', stagger: 0.07 }, 5.94)
  // "sell our product": the buyer on step 1 jumps, the box answers.
  .to('#cg-root .buyer', { y: -30, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, 7.04)
  .to('#cg-root .o1', { scale: 1.12, transformOrigin: '50% 100%', duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, 7.66)
  // "number three": the third step is called; "way": the path to it draws.
  .from('#cg-root .three', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 8.45)
  .to('#cg-root .l2', { opacity: 0.25, duration: 0.3, ease: 'power2.out' }, 8.45)
  .to('#cg-root .t2', { color: white, duration: 0.3 }, 8.45)
  .from('#cg-root .way', { autoAlpha: 0, x: -20, duration: 0.5, ease: 'expo.out' }, 9.95)
  // "attract": step 3 lights; "eyeballs": the eye opens and looks out over everything.
  .to('#cg-root .three', { autoAlpha: 0, y: -20, duration: 0.3, ease: 'power2.in' }, 10.3)
  .from('#cg-root .o3', { scale: 0.6, transformOrigin: '50% 50%', autoAlpha: 0, duration: 0.5, ease: 'back.out(1.4)' }, 10.38)
  .to('#cg-root .l3', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 10.4)
  .from('#cg-root .t3', { y: 24, autoAlpha: 0, duration: 0.45, ease: 'expo.out' }, 10.42)
  .to('#cg-root .t3', { color: ink, duration: 0.2 }, 10.42)
  .from('#cg-root .b3 path', { scaleY: 0, transformOrigin: '50% 100%', autoAlpha: 0, duration: 0.35, ease: 'power4.out', stagger: 0.06 }, 10.9)
  .to('#cg-root .who', { attr: { x: 712, y: 250 }, duration: 0.55, ease: 'power3.inOut' }, 10.95);
// Gentle life between the words: the figure breathes, the crowd shuffles, the beams pulse, the pupil looks around.
idle('#cg-root .who', { scaleY: 0.97, transformOrigin: '50% 100%' }, 1.0, 0.7);
idle('#cg-root .buyer', { x: 8 }, 2.4, 0.6);
idle('#cg-root .b2', { opacity: 0.45 }, 5.8, 0.5);
idle('#cg-root .c2 use', { y: -6, stagger: 0.1 }, 6.4, 0.45);
idle('#cg-root .three', { scale: 1.08, transformOrigin: '50% 50%' }, 8.95, 0.35);
idle('#cg-root .o3 .pupil', { x: 14 }, 10.9, 0.3);
tl.to('#cg-root .title, #cg-root .art, #cg-root .label', { autoAlpha: 0, y: -20, duration: 0.32, ease: 'power2.in', stagger: 0.02 }, D - 0.4);
window.__timelines = [tl];
</script>
