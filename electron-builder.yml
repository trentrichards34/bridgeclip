appId: com.wealthery.creatorclips
productName: CreatorClips
artifactName: CreatorClips-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Wealthery. Based on BridgeClip, Copyright © 2026 BridgeMind LLC (MIT)

# Disable production debug/code-injection entry points and validate app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!out/**/*.map"
  - package.json

# The Python bridge runner is invoked by the main process via child_process.spawn.
# It must live OUTSIDE app.asar so the filesystem path is directly readable by
# the Python interpreter. pipeline-runner.ts#getBridgeRunnerPath() looks it up
# via process.resourcesPath when app.isPackaged is true.
extraResources:
  - from: out/renderer/THIRD_PARTY_LICENSES.txt
    to: RENDERER-THIRD-PARTY-LICENSES.txt
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: src/renderer/assets/fonts/Geist-OFL.txt
    to: Geist-OFL.txt
  - from: src/renderer/assets/fonts/SpaceGrotesk-OFL.txt
    to: SpaceGrotesk-OFL.txt
  - from: src/renderer/assets/fonts/JetBrainsMono-OFL.txt
    to: JetBrainsMono-OFL.txt
  - from: bridge
    to: bridge
    filter:
      - "**/*.py"
      - "**/*.txt"
      - "!**/test_*.py"
  - from: engine
    to: engine
    filter:
      - "clip_engine/**/*"
      - "assets/**/*"
      - "requirements.txt"
      - "requirements.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: engine-venv
    to: engine-venv
    filter:
      - "**/*"
  - from: engine-bin
    to: engine-bin
    filter:
      - "**/*"

extraMetadata:
  main: ./out/main/index.js

mac:
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  # Local builds are unsigned. Release CI signs with Wealthery's Developer ID
  # through scripts/release/builder-config.cjs (identity = team ID, notarize).
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: CreatorClips records you on camera when you choose "Me, on camera" in Remix (reactions, takes and article or post videos).
    NSMicrophoneUsageDescription: CreatorClips records your voice for your on-camera reactions and takes in Remix.
  # Each native CI job stages one architecture's Python and media binaries.
  # Let the CLI architecture select these targets; an explicit arch list here
  # would override it and package incompatible resources into the other app.
  target:
    - dmg
    - zip
  # Turned on by scripts/release/builder-config.cjs for signed release builds,
  # with APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID from CI secrets.
  notarize: false

dmg:
  sign: false
  contents:
    - x: 180
      y: 240
      type: file
    - x: 480
      y: 240
      type: link
      path: /Applications

win:
  # The publisher whose signature updates must carry is set only for signed
  # release builds (scripts/release/builder-config.cjs, CREATORCLIPS_WIN_PUBLISHER).
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  # Builder otherwise expands x64 as x86_64 for AppImage and amd64 for DEB.
  # Linux currently supports x64 only; keep one stable release naming contract.
  artifactName: CreatorClips-${version}-linux-x64.${ext}
  executableName: bridgeclip
  category: AudioVideo
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Wealthery <trent@wealthery.com>

deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Auto-updates come from GitHub Releases in Wealthery's PUBLIC, installers-only
# repository (the source repository is private, and installed apps have no
# GitHub token). electron-updater reads latest-mac.yml / latest.yml from the
# release GitHub marks as latest. Keep in step with DEFAULT_RELEASES_REPOSITORY
# in src/shared/release-identity.ts; CI may override both with RELEASES_REPO.
publish:
  provider: github
  owner: trentrichards34
  repo: creatorclips-releases
